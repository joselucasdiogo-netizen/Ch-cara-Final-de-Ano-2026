<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chácara Final de Ano 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Caveat:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  /* ======================================================
     COMO ATUALIZAR QUEM PAGOU
     ------------------------------------------------------
     Procure o bloco "DADOS DA CHÁCARA" no <script> lá embaixo.
     Cada pessoa tem um array de 4 posições: [Set, Out, Nov, Dez]
     true  = pagou aquela parcela
     false = ainda não pagou
     Depois de editar, salve o arquivo e suba de novo pro GitHub.
     ====================================================== */

  :root{
    --bg-deep: #16241d;
    --bg-deep-2: #1d3226;
    --paper: #f4ecd8;
    --paper-shadow: #d9cca3;
    --ink: #24301f;
    --ink-soft: #55523f;
    --text-light: #efe7d2;
    --text-muted: #b9c2ab;
    --gold: #e3a23c;
    --gold-soft: #f0c26b;
    --terracotta: #c1543a;
    --stamp-green: #4c7a52;
    --line: rgba(239,231,210,0.14);
    --radius-card: 14px;
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(227,162,60,0.10), transparent 45%),
      radial-gradient(ellipse at 90% 0%, rgba(193,84,58,0.10), transparent 40%),
      var(--bg-deep);
    color: var(--text-light);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }

  /* ---------- string lights ---------- */
  .lights{
    display:flex;
    justify-content: space-between;
    padding: 18px 6px 0;
    max-width: 1080px;
    margin: 0 auto;
    overflow: hidden;
  }
  .lights svg{ width:100%; height:34px; display:block; }
  .bulb{
    animation: twinkle 3.2s ease-in-out infinite;
  }
  .bulb:nth-child(3n){ animation-delay: .4s; }
  .bulb:nth-child(4n){ animation-delay: 1.1s; }
  .bulb:nth-child(5n){ animation-delay: 1.8s; }
  @keyframes twinkle{
    0%, 100% { opacity: .55; }
    50% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce){
    .bulb{ animation: none; opacity: .9; }
  }

  /* ---------- header ---------- */
  header{
    text-align:center;
    padding: 28px 12px 8px;
  }
  .eyebrow{
    font-family:'Caveat', cursive;
    font-size: 1.5rem;
    color: var(--gold-soft);
    display:block;
    transform: rotate(-2deg);
    margin-bottom: -6px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(2.1rem, 5vw, 3.4rem);
    margin: 6px 0 4px;
    letter-spacing: -0.01em;
  }
  .subtitle{
    font-family:'Caveat', cursive;
    font-size: 1.35rem;
    color: var(--text-muted);
    margin: 0;
  }

  /* ---------- hero / progress ---------- */
  .hero{
    margin: 34px auto 8px;
    background: linear-gradient(180deg, var(--bg-deep-2), rgba(29,50,38,0.4));
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px clamp(18px, 4vw, 40px);
  }
  .hero-top{
    display:flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }
  .hero-amount{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    color: var(--gold-soft);
  }
  .hero-amount span{
    color: var(--text-muted);
    font-size: 0.5em;
    font-weight: 400;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  .hero-tag{
    font-size: 0.95rem;
    color: var(--text-muted);
    text-align:right;
  }
  .bar-track{
    height: 14px;
    border-radius: 999px;
    background: rgba(239,231,210,0.08);
    overflow:hidden;
    border: 1px solid var(--line);
  }
  .bar-fill{
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--terracotta), var(--gold));
    transition: width .6s ease;
  }
  .hero-stats{
    display:flex;
    flex-wrap: wrap;
    gap: 22px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px dashed var(--line);
  }
  .stat{
    min-width: 120px;
  }
  .stat b{
    display:block;
    font-family:'Fraunces', serif;
    font-size: 1.35rem;
    color: var(--text-light);
  }
  .stat span{
    font-size: 0.8rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* ---------- grid ---------- */
  .grid-label{
    margin: 42px 4px 16px;
    display:flex;
    align-items:center;
    gap: 12px;
    color: var(--text-muted);
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .grid-label::after{
    content:"";
    flex:1;
    height:1px;
    background: var(--line);
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }

  .card{
    position:relative;
    background: var(--paper);
    color: var(--ink);
    border-radius: var(--radius-card);
    padding: 16px 16px 14px;
    box-shadow: 0 8px 0 -4px var(--paper-shadow), 0 10px 18px rgba(0,0,0,0.28);
    transform: rotate(var(--tilt, 0deg));
  }
  .card:nth-child(4n+1){ --tilt: -0.6deg; }
  .card:nth-child(4n+2){ --tilt: 0.5deg; }
  .card:nth-child(4n+3){ --tilt: -0.3deg; }
  .card:nth-child(4n+4){ --tilt: 0.7deg; }

  .card .pin{
    position:absolute;
    top:-7px; left:50%;
    transform: translateX(-50%);
    width:14px; height:14px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--gold-soft), var(--terracotta) 75%);
    box-shadow: 0 2px 3px rgba(0,0,0,0.35);
  }

  .card.done{ outline: 2px solid var(--stamp-green); }
  .ribbon{
    position:absolute;
    top:10px; right:-6px;
    background: var(--stamp-green);
    color: var(--paper);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 3px 10px 3px 8px;
    border-radius: 3px 0 0 3px;
  }
  .ribbon::after{
    content:"";
    position:absolute;
    right:-6px; top:0;
    border-style:solid;
    border-width: 0 6px 10px 0;
    border-color: transparent transparent transparent #345c39;
  }

  .card h3{
    font-family:'Fraunces', serif;
    font-size: 1.12rem;
    margin: 6px 0 10px;
    padding-right: 30px;
  }

  .stamps{
    display:flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .stamp{
    flex:1;
    text-align:center;
  }
  .stamp .circle{
    width: 34px; height:34px;
    margin: 0 auto 4px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size: 0.85rem;
    font-weight:700;
    border: 2px dashed rgba(36,48,31,0.35);
    color: rgba(36,48,31,0.4);
  }
  .stamp.paid .circle{
    border: 2px solid var(--stamp-green);
    background: rgba(76,122,82,0.15);
    color: var(--stamp-green);
    transform: rotate(-8deg);
  }
  .stamp small{
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
  }

  .card-foot{
    display:flex;
    justify-content: space-between;
    align-items:center;
    font-size: 0.78rem;
    color: var(--ink-soft);
    border-top: 1px dashed rgba(36,48,31,0.25);
    padding-top: 8px;
  }
  .card-foot b{ color: var(--ink); }

  /* ---------- footer ---------- */
  footer{
    text-align:center;
    margin-top: 50px;
    color: var(--text-muted);
    font-size: 0.82rem;
  }
  footer .script{
    font-family:'Caveat', cursive;
    font-size: 1.1rem;
    color: var(--gold-soft);
    display:block;
    margin-bottom: 4px;
  }

  a, button{ font-family: inherit; }
  :focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }
</style>
</head>
<body>

<div class="lights" aria-hidden="true">
  <svg viewBox="0 0 1000 34" preserveAspectRatio="none">
    <polyline points="0,4 60,26 120,4 180,26 240,4 300,26 360,4 420,26 480,4 540,26 600,4 660,26 720,4 780,26 840,4 900,26 960,4 1000,16"
      fill="none" stroke="rgba(239,231,210,0.25)" stroke-width="1.5"/>
    <g id="bulbs"></g>
  </svg>
</div>

<div class="wrap">
  <header>
    <span class="eyebrow">confraternização de fim de ano</span>
    <h1>Chácara Final de Ano 2026</h1>
    <p class="subtitle">quem já garantiu o lugar na roda</p>
  </header>

  <section class="hero">
    <div class="hero-top">
      <div class="hero-amount" id="heroAmount">R$ 0 <span>arrecadados</span></div>
      <div class="hero-tag" id="heroTag">de R$ 0 — 0%</div>
    </div>
    <div class="bar-track"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
    <div class="hero-stats">
      <div class="stat"><b id="statPessoas">–</b><span>pessoas</span></div>
      <div class="stat"><b id="statPorPessoa">–</b><span>por pessoa</span></div>
      <div class="stat"><b id="statParcela">–</b><span>por parcela</span></div>
      <div class="stat"><b id="statQuitados">–</b><span>já quitaram</span></div>
    </div>
  </section>

  <div class="grid-label">Set · Out · Nov · Dez</div>
  <div class="grid" id="grid"></div>

  <footer>

    <span class="script"> Pix para pagamento: 💵 19991394559 </span>
    atualizado manualmente por José Lucas
   

  </footer>
</div>

<script>
/* ======================================================
   DADOS DA CHÁCARA — edite aqui
   ------------------------------------------------------
   pagamentos: [Setembro, Outubro, Novembro, Dezembro]
   true = pago · false = em aberto
   ====================================================== */
const CONFIG = {
  valorChacara: 3600,
  valorParcela: 45,
  meses: ["Set", "Out", "Nov", "Dez"],
  mesesNomes: ["Setembro", "Outubro", "Novembro", "Dezembro"]
};

const pessoas = [
  { nome: "José Lucas",    pagamentos: [false, false, false, false] },
  { nome: "Aninha",        pagamentos: [false, false, false, false] },
  { nome: "Alex",          pagamentos: [false, false, false, false] },
  { nome: "Marilia",       pagamentos: [true, true, false, false] },
  { nome: "Rute",          pagamentos: [true, true, true, true] },
  { nome: "Dani",          pagamentos: [false, false, false, false] },
  { nome: "Mariana",       pagamentos: [true, false, false, false] },
  { nome: "Léo",           pagamentos: [true, false, false, false] },
  { nome: "Vitoria",       pagamentos: [false, false, false, false] },
  { nome: "Joana",         pagamentos: [false, false, false, false] },
  { nome: "José Marques",  pagamentos: [false, false, false, false] },
  { nome: "Julia",         pagamentos: [false, false, false, false] },
  { nome: "Bruno",         pagamentos: [false, false, false, false] },
  { nome: "Marilia Zilda", pagamentos: [false, false, false, false] },
  { nome: "Henrrique",     pagamentos: [false, false, false, false] },
  { nome: "Laercio",       pagamentos: [false, false, false, false] },
  { nome: "Riva",          pagamentos: [false, false, false, false] },
  { nome: "Zilda",         pagamentos: [false, false, false, false] },
  { nome: "Evani",         pagamentos: [false, false, false, false] },
  { nome: "Liti",          pagamentos: [false, false, false, false] }
];

/* ====================================================== */

const fmt = (n) => n.toLocaleString('pt-BR', { style:'currency', currency:'BRL', maximumFractionDigits:0 });

function render(){
  const valorPorPessoa = CONFIG.valorParcela * 4;
  const totalPessoas = pessoas.length;

  let arrecadado = 0;
  let quitados = 0;

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  pessoas.forEach(p => {
    const pagas = p.pagamentos.filter(Boolean).length;
    arrecadado += pagas * CONFIG.valorParcela;
    const completo = pagas === 4;
    if (completo) quitados++;

    const card = document.createElement('div');
    card.className = 'card' + (completo ? ' done' : '');

    const stampsHtml = p.pagamentos.map((pago, i) => `
      <div class="stamp ${pago ? 'paid' : ''}">
        <div class="circle">${pago ? '✓' : CONFIG.meses[i]}</div>
        <small>${CONFIG.meses[i]}</small>
      </div>
    `).join('');

    card.innerHTML = `
      <div class="pin"></div>
      ${completo ? '<div class="ribbon">QUITADO</div>' : ''}
      <h3>${p.nome}</h3>
      <div class="stamps">${stampsHtml}</div>
      <div class="card-foot">
        <span>${pagas}/4 parcelas</span>
        <b>${fmt(pagas * CONFIG.valorParcela)} / ${fmt(valorPorPessoa)}</b>
      </div>
    `;
    grid.appendChild(card);
  });

  const pct = Math.min(100, Math.round((arrecadado / CONFIG.valorChacara) * 100));
  document.getElementById('heroAmount').innerHTML = `${fmt(arrecadado)} <span>arrecadados</span>`;
  document.getElementById('heroTag').textContent = `de ${fmt(CONFIG.valorChacara)} — ${pct}%`;
  document.getElementById('barFill').style.width = pct + '%';
  document.getElementById('statPessoas').textContent = totalPessoas;
  document.getElementById('statPorPessoa').textContent = fmt(valorPorPessoa);
  document.getElementById('statParcela').textContent = fmt(CONFIG.valorParcela);
  document.getElementById('statQuitados').textContent = `${quitados}/${totalPessoas}`;
}

function renderLights(){
  const g = document.getElementById('bulbs');
  const xs = [0,60,120,180,240,300,360,420,480,540,600,660,720,780,840,900,960];
  const ys = [4,26,4,26,4,26,4,26,4,26,4,26,4,26,4,26,4];
  const colors = ['#e3a23c','#c1543a','#f0c26b','#4c7a52'];
  xs.forEach((x,i) => {
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx', x); c.setAttribute('cy', ys[i]); c.setAttribute('r', 5);
    c.setAttribute('fill', colors[i % colors.length]);
    c.setAttribute('class','bulb');
    g.appendChild(c);
  });
}

render();
renderLights();
</script>

</body>
</html>
